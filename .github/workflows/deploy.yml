name: GitHub Pages deployment disabled

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  disabled:
    runs-on: ubuntu-latest

    steps:
      - name: Explain
        run: echo "GitHub Pages deployment is disabled. Use Vercel Git integration for CI/CD."
